<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172b2a">
  <meta name="description" content="一页式个人主页，介绍我的方向、技能与联系方式。">
  <title>Hi OneX</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172b2a;
      --muted: #526967;
      --paper: #f5f6f0;
      --line: #cad4cc;
      --lime: #d9ee70;
      --blue: #bcd8e0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #587500; outline-offset: 4px; }
    .page { width: min(1100px, calc(100% - 48px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 26px 0; border-bottom: 1px solid var(--line); }
    .mark { font-size: 15px; font-weight: 750; letter-spacing: -.03em; }
    .availability { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .availability::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #83a332; }
    main { padding: clamp(56px, 10vw, 126px) 0 92px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(220px, .6fr); gap: 64px; align-items: end; }
    h1 { max-width: 720px; margin: 0; font-size: clamp(48px, 8.5vw, 104px); line-height: .98; letter-spacing: -.075em; font-weight: 700; }
    h1 span { display: block; }
    .lead { max-width: 360px; margin: 24px 0 0; color: var(--muted); font-size: 17px; line-height: 1.8; }
    .note { padding: 22px; background: var(--lime); border-radius: 2px 34px 2px 2px; transform: rotate(2deg); }
    .note p { margin: 0; font-size: 16px; line-height: 1.65; }
    .note small { display: block; margin-top: 18px; color: #4b5a20; font-size: 12px; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; margin-top: clamp(70px, 11vw, 130px); padding-top: 24px; border-top: 1px solid var(--line); }
    h2 { margin: 0 0 20px; font-size: 13px; font-weight: 650; color: var(--muted); }
    .skills { display: flex; flex-wrap: wrap; gap: 9px; }
    .skills span { padding: 9px 13px; border: 1px solid var(--line); border-radius: 99px; font-size: 13px; }
    .contact { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
    .contact a { font-size: 17px; text-decoration-thickness: 1px; text-underline-offset: 5px; }
    footer { display: flex; justify-content: space-between; gap: 16px; padding: 20px 0 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    @media (max-width: 700px) {
      .page { width: min(100% - 36px, 560px); }
      .intro { grid-template-columns: 1fr; gap: 38px; }
      .note { max-width: 330px; margin-left: auto; }
      .details { grid-template-columns: 1fr; gap: 36px; margin-top: 76px; }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="mark">个人主页 / 2026</div>
      <div class="availability">欢迎认识新朋友</div>
    </header>
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div>
          <h1 id="intro-title"><span>你好，</span><span>我是你的名字。</span></h1>
          <p class="lead">我正在探索自己感兴趣的事，也喜欢把想法做成真实可用的小作品。</p>
        </div>
        <aside class="note">
          <p>“先做出来，再一点点变好。”</p>
          <small>最近提醒自己的话</small>
        </aside>
      </section>
      <section class="details">
        <div>
          <h2>我正在学习</h2>
          <div class="skills" aria-label="技能">
            <span>写作</span><span>产品思考</span><span>网页设计</span><span>AI 工具</span>
          </div>
        </div>
        <div>
          <h2>联系我</h2>
          <div class="contact">
            <a href="mailto:xwjdsn@gmail.com">hello@example.com</a>
            <a href="https://github.com/your-username">GitHub 主页</a>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <span>这是我的小小网络角落。</span>
      <span>用好奇心制作 · 2026</span>
    </footer>
  </div>
</body>
</html>
